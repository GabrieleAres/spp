<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esercitazione SPP – Autovalutazione dei ruoli</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#5b6675;--ac:#0b5cab;--ac2:#e6f0fb;--bd:#d5dbe3;--ok:#1a7f4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#9aa6b5;--ac:#5aa9f0;--ac2:#1e3248;--bd:#303a46;--ok:#4cc386}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.area{font-weight:700;color:var(--ac)}
.act{font-size:.92rem;color:var(--mu);margin:4px 0 8px}
.task{font-size:.92rem;margin:0 0 12px}
.q{margin-top:10px}
.q b{display:block;font-size:.95rem;margin-bottom:6px}
.opts{display:flex;gap:6px}
.opts label{flex:1}
.opts input{position:absolute;opacity:0}
.opts span{display:block;text-align:center;padding:9px 4px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:.9rem}
.opts input:checked+span{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.opts input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=date]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
label.f{font-size:.9rem;color:var(--mu)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.track{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .2s}
.cnt{font-size:.85rem;color:var(--mu);margin-top:4px}
button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;margin:4px 6px 4px 0}
button.sec{background:transparent;color:var(--ac)}
#res{display:none}
#out{white-space:pre-wrap;font:.9rem/1.4 system-ui,sans-serif;margin:0}
button:disabled{opacity:.6;cursor:default}
@media print{main>*:not(#res){display:none!important}#res{display:block!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1>Esercitazione – Ruoli del SPP</h1>
<p class="sub">Per ogni area rispondi alle tre domande. Non ci sono risposte giuste o sbagliate: serve a riflettere sul tuo ruolo.</p>
<div class="card">
<label class="f" for="nome">Nome e cognome</label>
<input type="text" id="nome" autocomplete="name">
<label class="f" for="data">Data</label>
<input type="date" id="data">
</div>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><div class="cnt" id="cnt"></div></div>
<div id="list"></div>
<div class="card noprint"><button id="go">Invia e stampa</button><p class="sub" id="msg" style="margin:8px 0 0"></p></div>
<div id="res"><h2>Esercitazione SPP – Ruoli del SPP</h2><pre id="out"></pre></div>
</main>
<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbzv9_7CIgS4LseWfHRmFlkNTruNggjItxSb8zq0WQDQGDtnyZZJpJyMlP2ff4M5oFTF/exec";
var Q=["Mi riconosco nei compiti che seguo in azienda?","Sono interessato a poter esercitare questo ruolo?","Penso di avere conoscenze e strumenti per esercitare il ruolo?"];
var O=["Sì","In parte","No"];
var R=[
["1.1 Analisi del contesto organizzativo","Esaminare l’assetto organizzativo e aggiornare nomine, designazioni e incarichi specifici.","Analisi di statuto, delibere del CdA, incarichi a dirigenti e preposti, organigramma, ciclo produttivo, deleghe, nomine (SPP, medico competente, primo soccorso, emergenze), visura camerale."],
["1.2 Requisiti legislativi, acquisizione e controllo documentazione","Individuare leggi e norme applicabili e acquisire la documentazione tecnica, autorizzativa e certificativa.","Documentazione su luoghi di lavoro, prevenzione incendi, macchine e attrezzature, impianti, sostanze e miscele (SDS, REACH, CLP), formazione, sorveglianza sanitaria, infortuni, appalti (art. 26, DURC). Aggiornamento legislativo e suggerimenti alle funzioni aziendali."],
["2.1 Identificazione dei pericoli e valutazione dei rischi","Valutare i rischi per predisporre, redigere e aggiornare il DVR.","Analisi di attività e processi, individuazione dei pericoli e valutazione dei rischi con sopralluoghi (anche con medico competente e RLS); acquisizione del protocollo sanitario e dei registri degli esposti."],
["2.2 Misure e interventi di prevenzione e protezione","Definire le misure di prevenzione e protezione per il DVR.","Misure tecniche, organizzative e gestionali; procedure di salute e sicurezza; procedure di emergenza; procedure di primo soccorso con il medico competente."],
["3.1 Attuazione e verifica delle misure (1/3): luoghi, attrezzature, DPI","Pianificare verifiche documentali e in sito su luoghi di lavoro, attrezzature, DPI, impianti, segnaletica e procedure.","Luoghi di lavoro (All. IV, SCIA-CPI, monitoraggi agenti fisici/chimici/biologici); attrezzature (marcatura CE, All. V, verifiche e manutenzioni, apparecchiature a pressione e di sollevamento); idoneità di DPI e DPC."],
["3.1 Attuazione e verifica delle misure (2/3): impianti, segnaletica, procedure","Verifiche su impianti elettrici, segnaletica e procedure.","Dichiarazioni di conformità e verifiche periodiche (messa a terra, ATEX, scariche atmosferiche); idoneità della segnaletica; procedure per emergenze, spazi confinati, LOTO, lavori elettrici e in quota, lavoro isolato, consegna DPI, registri."],
["3.1 Attuazione e verifica delle misure (3/3): stress lavoro-correlato e differenze","Verifiche su stress lavoro-correlato e rischi legati a differenze tra lavoratori.","Percorso metodologico dell’Intesa della Commissione Consultiva (circolare 18/11/2010); rischi legati a genere, età, provenienza geografica e tipologia contrattuale."],
["4.1 Procedure interne e rapporti con autorità e fornitori (1/2)","Assistenza in caso di ispezioni, denunce di infortunio e DUVRI.","Assistenza al datore di lavoro durante ispezioni degli Organi di Vigilanza e nelle denunce di infortunio; supporto a uffici legali/acquisti per cantieri interni, DUVRI e riunioni di coordinamento (Titolo IV)."],
["4.1 Procedure interne e rapporti con autorità e fornitori (2/2)","Rapporto con uffici legali/acquisti e gestione dei DPI.","Supporto a legali/acquisti e riunioni di coordinamento per i cantieri; indicazione dei DPI dopo la valutazione, verifica di idoneità e aggiornamento del sistema di consegna e manutenzione."],
["4.2 Formazione, comunicazione, consultazione – Informazione","Gestire e pianificare i programmi di informazione.","Analisi delle esigenze informative per nuovi rischi o modifiche del contesto; piani di informazione, anche per gruppi sensibili; supporto alla comunicazione aziendale sui rischi."],
["4.2 Formazione, comunicazione, consultazione – Formazione","Gestire e pianificare i programmi di formazione.","Analisi dei fabbisogni formativi (corsi obbligatori, cambi mansione, nuove tecnologie, aggiornamenti); piani formativi con il datore di lavoro; progettazione e monitoraggio dell’efficacia; condivisione con l’OPP dopo consultazione dell’RLS."],
["4.2 Formazione, comunicazione, consultazione – Addestramento e consultazione","Pianificare addestramento e consultazioni.","Esigenze di addestramento (attrezzature, DPI, procedure); prove di emergenza ed evacuazione; riunione periodica annuale con DL, MC, RLS; consultazioni con RLS/RLST e partecipazione dei lavoratori."],
["5.1 Riesame periodico, monitoraggio e analisi di non conformità, infortuni e incidenti","Analizzare dati di monitoraggio, infortuni e mancati infortuni.","Analisi dei dati dei controlli operativi e non conformità, con report nella riunione periodica; indagine su infortuni e malattie professionali, statistiche; analisi dei mancati infortuni con misure di prevenzione."],
["6.1 Azioni correttive e migliorative per il miglioramento continuo","Individuare interventi e azioni correttive dagli esiti del riesame.","Definizione del programma di miglioramento delle misure da adottare, in collaborazione con le funzioni aziendali."]
];
var list=document.getElementById("list"),html="";
R.forEach(function(r,i){
 html+='<section class="card"><div class="area">'+r[0]+'</div><div class="act">'+r[1]+'</div><p class="task"><b>Compiti:</b> '+r[2]+'</p>';
 Q.forEach(function(q,j){
  html+='<div class="q"><b>'+q+'</b><div class="opts">';
  O.forEach(function(o,k){html+='<label><input type="radio" name="r'+i+'_'+j+'" value="'+o+'"><span>'+o+'</span></label>';});
  html+='</div></div>';
 });
 html+='</section>';
});
list.innerHTML=html;
var tot=R.length*3;
function upd(){
 var n=document.querySelectorAll("#list input:checked").length;
 document.getElementById("fill").style.width=(n/tot*100)+"%";
 document.getElementById("cnt").textContent="Risposte: "+n+" su "+tot;
}
list.addEventListener("change",upd);upd();
var d=new Date();document.getElementById("data").value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
document.getElementById("go").onclick=function(){
 var btn=this,m=document.getElementById("msg"),nome=document.getElementById("nome").value.trim();
 if(!nome){m.textContent="Inserisci nome e cognome prima di inviare.";document.getElementById("nome").focus();return;}
 var dt=document.getElementById("data").value;
 var t="Nome e cognome: "+nome+"\nData: "+dt+"\n";
 var row=[nome,dt];
 R.forEach(function(r,i){
  t+="\n"+r[0]+"\n";
  Q.forEach(function(q,j){
   var c=document.querySelector('input[name="r'+i+'_'+j+'"]:checked');
   t+="  - "+q+" "+(c?c.value:"(nessuna risposta)")+"\n";
   row.push(c?c.value:"");
  });
 });
 document.getElementById("out").textContent=t;
 btn.disabled=true;m.textContent="Invio in corso…";
 function stampa(){btn.disabled=false;setTimeout(function(){window.print();},200);}
 fetch(ENDPOINT,{method:"POST",body:JSON.stringify(row)})
  .then(function(r){return r.json();})
  .then(function(d){m.textContent=d&&d.ok?"Risposte inviate.":"Invio non confermato: consegna la stampa al docente.";stampa();})
  .catch(function(){m.textContent="Invio non confermato: consegna la stampa al docente.";stampa();});
};
</script>
</body>
</html>
