<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard docente · Ruoli SPP</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172b44;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ab8fa}header{background:#102b4d;color:white;padding:22px max(24px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a7c7e9}h1{font-size:25px;margin:5px 0}header p{margin:0;color:#c5d6ea;font-size:13px}.status{font-size:13px;background:#22466c;padding:9px 13px;border-radius:25px}.dot{display:inline-block;width:9px;height:9px;background:#5de3a3;border-radius:50%;margin-right:7px}.dot.off{background:#ff9a9a}main{max-width:1320px;margin:auto;padding:26px 24px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi,.panel,.filterbox{background:white;border:1px solid #e0e8f2;border-radius:16px;box-shadow:0 3px 15px #17385b08}.kpi{padding:20px}.kpi strong{display:block;font-size:30px;color:#153d6b}.kpi span{color:#63748b;font-size:13px}.filterbox{padding:17px;margin:18px 0}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:165px;flex:1}.field label{font-size:12px;font-weight:700;color:#526782}select,input{width:100%;border:1px solid #d3deec;border-radius:9px;padding:10px;background:white;color:#173453}.search{flex:2;min-width:230px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}.nav button,.btn{border:1px solid #cbd9ea;background:white;color:#284a70;padding:10px 15px;border-radius:10px;font-weight:650}.nav button.active{background:#145a9e;color:white;border-color:#145a9e}.panel{padding:20px;margin-bottom:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h2{font-size:19px;margin:0}small,.muted{color:#65778f}.gridarea{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.areacard{border:1px solid #dce5f0;border-radius:13px;padding:16px;background:#fff;text-align:left;color:inherit}.areacard:hover{border-color:#438ed1;background:#f8fbff}.areacard h3{font-size:15px;margin:6px 0 14px;min-height:43px}.code{font-size:12px;color:#1562a3;font-weight:750}.metrics{display:flex;justify-content:space-between;gap:6px}.metric{text-align:center;background:#f1f6fb;border-radius:8px;padding:8px;flex:1}.metric b{display:block;font-size:18px}.metric span{font-size:10px;color:#60748b}.progress{height:7px;background:#e7edf5;border-radius:20px;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:#299f81}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.subnav button{padding:8px 12px;border:1px solid #d6e2ef;border-radius:8px;background:white;color:#315579}.subnav button.active{background:#e7f2ff;border-color:#3184c7;color:#145a9e}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}.answer{background:#f7faff;border:1px solid #e0e9f4;border-radius:12px;padding:14px;overflow-wrap:anywhere}.answer b{display:block;font-size:13px;color:#205587;margin-bottom:8px}.answer p{white-space:pre-wrap;margin:0;font-size:14px}.question{margin:18px 0 12px;font-weight:750}.people{display:grid;gap:10px}.person{border:1px solid #dce6f0;border-radius:12px;overflow:hidden}.person summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}.person[open] summary{background:#f3f8fe}.personbody{padding:15px}.area-section{margin:16px 0;border-top:1px solid #e2eaf2;padding-top:12px}.area-section h3{font-size:14px;color:#205587}.answerline{padding:9px 0;font-size:13px;border-bottom:1px dashed #e2eaf2}.answerline b{display:block;color:#526780;margin-bottom:4px}.answerline p{margin:0;white-space:pre-wrap}.empty{padding:35px;text-align:center;color:#6a7b91}.pill{border-radius:20px;padding:4px 10px;background:#e8f2ff;color:#175a95;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn.primary{background:#145a9e;color:white;border-color:#145a9e}#login{max-width:390px;margin:12vh auto;background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #142b4920}#login h2{margin-bottom:8px}#login input{margin:18px 0 10px}#login button{width:100%}.error{color:#ba2d37;font-size:13px}.hide{display:none!important}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}main{padding:16px}.panel{padding:15px}header{padding:20px}.kpi{padding:15px}.kpi strong{font-size:25px}}@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr}.metric{padding:6px}}
</style></head><body><section id="login"><div class="eyebrow">ACCESSO RISERVATO</div><h2>Area docente</h2><p class="muted">Accedi per consultare le risposte dei partecipanti.</p><input type="password" id="cod" placeholder="Codice docente" autocomplete="current-password"><button class="btn primary" id="enter">Accedi ai risultati</button><p id="err" class="error"></p></section><div id="app" class="hide"><header><div><div class="eyebrow">DASHBOARD DOCENTE</div><h1>Ruoli del Servizio di Prevenzione e Protezione</h1><p>Analisi delle risposte dei partecipanti</p></div><div class="status"><span id="dot" class="dot"></span><span id="agg">Connessione in corso…</span></div></header><main><section id="kpis" class="kpis"></section><div class="filterbox"><div class="filters"><div class="field"><label for="fd">Data della sessione</label><select id="fd"><option value="">Tutte le date</option></select></div><div class="field"><label for="fp">Partecipante</label><select id="fp"><option value="">Tutti i partecipanti</option></select></div><div class="field search"><label for="q">Cerca nelle risposte</label><input id="q" type="search" placeholder="Nome, parola chiave, testo…"></div><button class="btn" id="reset">Azzera filtri</button></div></div><nav class="nav" id="tabs"><button data-tab="overview" class="active">Panoramica aree</button><button data-tab="compare">Confronta risposte</button><button data-tab="people">Per partecipante</button></nav><section class="panel"><div class="panelhead"><div><h2 id="viewtitle">Panoramica delle 14 aree</h2><small id="subtitle">Seleziona un'area per esaminare le risposte</small></div><div class="toolbar"><button class="btn" id="export">Esporta CSV</button></div></div><div id="view"></div></section></main></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzv9_7CIgS4LseWfHRmFlkNTruNggjItxSb8zq0WQDQGDtnyZZJpJyMlP2ff4M5oFTF/exec';
var AREE=["1.1","1.2","2.1","2.2","3.1 (1/3)","3.1 (2/3)","3.1 (3/3)","4.1 (1/2)","4.1 (2/2)","4.2 Informazione","4.2 Formazione","4.2 Addestramento","5.1","6.1"];
var TIT=["Analisi del contesto organizzativo","Requisiti legislativi e documentazione","Identificazione pericoli e valutazione rischi","Misure di prevenzione e protezione","Verifica misure: luoghi, attrezzature, DPI","Verifica misure: impianti, segnaletica, procedure","Verifica misure: stress lavoro-correlato e differenze","Procedure interne, autorità e fornitori (1/2)","Procedure interne, autorità e fornitori (2/2)","Informazione","Formazione","Addestramento e consultazione","Riesame, monitoraggio, infortuni e incidenti","Azioni correttive e miglioramento continuo"];
var DOM=["Mi riconosco nei compiti che seguo in azienda?","Sono interessato a poter esercitare questo ruolo?","Penso di avere conoscenze e strumenti per esercitare il ruolo?"];

let code='',raw=[],rows=[],lastSignature='',tab='overview',selectedArea=0,selectedQuestion=0,requestBusy=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const has=(s,q)=>String(s??'').toLocaleLowerCase('it').includes(q.toLocaleLowerCase('it'));const filled=r=>(r.r||[]).filter(x=>String(x??'').trim()).length;const fmtD=d=>d?d.split('-').reverse().join('/'):'—';const val=(r,i,j)=>String((r.r||[])[i*3+j]??'').trim();
try{code=sessionStorage.getItem('cod')||''}catch(e){}$('enter').onclick=()=>{code=$('cod').value.trim();if(code)poll(true)};$('cod').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};if(code)poll(true);
async function poll(first=false){if(requestBusy)return;requestBusy=true;try{const res=await fetch(ENDPOINT+'?azione=dati&codice='+encodeURIComponent(code),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();if(d?.errore){try{sessionStorage.removeItem('cod')}catch(e){}$('login').classList.remove('hide');$('app').classList.add('hide');$('err').textContent='Codice docente non valido.';code='';return}if(!Array.isArray(d.righe))throw Error('Formato dati inatteso');try{sessionStorage.setItem('cod',code)}catch(e){}$('login').classList.add('hide');$('app').classList.remove('hide');$('dot').classList.remove('off');$('agg').textContent='Aggiornato alle '+new Date().toLocaleTimeString('it-IT');const signature=JSON.stringify(d.righe);if(first||signature!==lastSignature){lastSignature=signature;raw=d.righe;dedup();fillFilters();render()}}catch(e){$('dot').classList.add('off');$('agg').textContent='Connessione non disponibile';if(first)$('err').textContent='Impossibile caricare i dati. Riprova.';console.error(e)}finally{requestBusy=false}}
setInterval(()=>{if(code&&!document.hidden)poll()},5000);
function dedup(){const m=new Map();for(const r of raw){const key=String(r.nome??'').trim().toLocaleLowerCase('it')+'|'+r.data;const old=m.get(key);if(!old||String(r.ts??'')>=String(old.ts??''))m.set(key,r)}rows=[...m.values()].sort((a,b)=>String(b.ts??'').localeCompare(String(a.ts??'')))}
function fillFilters(){const d=$('fd').value,p=$('fp').value;const dates=[...new Set(rows.map(r=>r.data).filter(Boolean))].sort().reverse();$('fd').innerHTML='<option value="">Tutte le date</option>'+dates.map(x=>`<option value="${esc(x)}">${esc(fmtD(x))}</option>`).join('');$('fd').value=dates.includes(d)?d:'';const names=[...new Set(rows.map(r=>r.nome).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));$('fp').innerHTML='<option value="">Tutti i partecipanti</option>'+names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('fp').value=names.includes(p)?p:''}
function baseRows(){return rows.filter(r=>(!$('fd').value||r.data===$('fd').value)&&(!$('fp').value||r.nome===$('fp').value))}function visibleRows(){const q=$('q').value.trim();return baseRows().filter(r=>!q||has(r.nome,q)||(r.r||[]).some(t=>has(t,q)))}
function render(){const rs=visibleRows(),total=rs.reduce((s,r)=>s+filled(r),0),last=rs.reduce((m,r)=>String(r.ts??'')>m?String(r.ts):m,'');$('kpis').innerHTML=`<div class="kpi"><strong>${rs.length}</strong><span>Partecipazioni visualizzate</span></div><div class="kpi"><strong>${total}</strong><span>Risposte compilate</span></div><div class="kpi"><strong>${rs.length?Math.round(total/(rs.length*42)*100):0}%</strong><span>Completamento delle 42 domande</span></div><div class="kpi"><strong>${last?esc(last.slice(11,16)):'—'}</strong><span>Ultimo invio ${last?esc(fmtD(last.slice(0,10))):''}</span></div>`;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='overview')overview(rs);else if(tab==='compare')compare(rs);else people(rs)}
function overview(rs){$('viewtitle').textContent='Panoramica delle 14 aree';$('subtitle').textContent='Ogni scheda mostra le risposte presenti alle tre domande (D1, D2, D3).';$('view').innerHTML=rs.length?'<div class="gridarea">'+AREE.map((a,i)=>{const n=DOM.map((_,j)=>rs.filter(r=>val(r,i,j)).length),tot=n.reduce((x,y)=>x+y,0),pct=Math.round(tot/(rs.length*3)*100);return `<button class="areacard" data-area="${i}"><span class="code">AREA ${esc(a)}</span><h3>${esc(TIT[i])}</h3><div class="metrics">${n.map((x,j)=>`<div class="metric"><b>${x}</b><span>D${j+1}</span></div>`).join('')}</div><div class="progress"><i style="width:${pct}%"></i></div><small>${pct}% delle risposte compilate</small></button>`}).join('')+'</div>':'<div class="empty">Nessun risultato per i filtri selezionati.</div>';document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{selectedArea=Number(b.dataset.area);tab='compare';render()})}
function compare(rs){$('viewtitle').textContent='Confronto delle risposte';$('subtitle').textContent='Scegli un’area e una domanda per confrontare le risposte testuali.';const controls=`<div class="filters" style="margin-bottom:16px"><div class="field"><label>Area tematica</label><select id="areaSelect">${AREE.map((a,i)=>`<option value="${i}" ${i===selectedArea?'selected':''}>${esc(a)} · ${esc(TIT[i])}</option>`).join('')}</select></div></div><div class="subnav">${DOM.map((d,j)=>`<button data-question="${j}" class="${j===selectedQuestion?'active':''}">Domanda ${j+1}</button>`).join('')}</div><div class="question">${esc(DOM[selectedQuestion])}</div>`;const answers=rs.filter(r=>val(r,selectedArea,selectedQuestion));$('view').innerHTML=controls+`<p class="muted">${answers.length} risposte su ${rs.length} partecipazioni visualizzate</p>`+(answers.length?'<div class="answers">'+answers.map(r=>`<article class="answer"><b>${esc(r.nome)} <span class="muted">· ${esc(fmtD(r.data))}</span></b><p>${esc(val(r,selectedArea,selectedQuestion))}</p></article>`).join('')+'</div>':'<div class="empty">Nessuna risposta compilata per questa domanda.</div>');$('areaSelect').onchange=e=>{selectedArea=Number(e.target.value);render()};document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{selectedQuestion=Number(b.dataset.question);render()})}
function people(rs){$('viewtitle').textContent='Risposte per partecipante';$('subtitle').textContent='Apri un nominativo per consultare tutte le sue risposte.';$('view').innerHTML=rs.length?'<div class="people">'+rs.map((r,k)=>`<details class="person"><summary><span>${esc(r.nome)}</span><span class="pill">${filled(r)}/42 · ${esc(fmtD(r.data))}</span></summary><div class="personbody">${AREE.map((a,i)=>`<section class="area-section"><h3>${esc(a)} · ${esc(TIT[i])}</h3>${DOM.map((d,j)=>`<div class="answerline"><b>${esc(d)}</b><p>${val(r,i,j)?esc(val(r,i,j)):'<span class="muted">Non compilata</span>'}</p></div>`).join('')}</section>`).join('')}</div></details>`).join('')+'</div>':'<div class="empty">Nessun partecipante corrisponde ai filtri.</div>'}
$('fd').onchange=render;$('fp').onchange=render;$('q').oninput=render;$('reset').onclick=()=>{$('fd').value='';$('fp').value='';$('q').value='';render()};$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
$('export').onclick=()=>{const rs=visibleRows();if(!rs.length)return;const headers=['Nome','Data','Timestamp',...AREE.flatMap((a,i)=>DOM.map((d,j)=>`${a} - Domanda ${j+1}: ${d}`))];const csv=[headers,...rs.map(r=>[r.nome,r.data,r.ts,...Array.from({length:42},(_,i)=>r.r?.[i]??'')])].map(line=>line.map(v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,'\'$&').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='risultati_spp.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
